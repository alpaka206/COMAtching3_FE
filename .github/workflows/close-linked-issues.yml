name: 이슈 자동 종료

on:
  pull_request:
    types:
      - closed
    branches:
      - develop

permissions:
  contents: read
  issues: write
  pull-requests: read

jobs:
  close-linked-issues:
    name: develop PR 연결 이슈 종료
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest

    steps:
      - name: 연결 이슈 종료
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail

          issue_numbers="$(
            jq -r '.pull_request.body // ""' "$GITHUB_EVENT_PATH" |
              grep -Eio '\b(close|closes|closed|fix|fixes|fixed|resolve|resolves|resolved)[[:space:]]+#[0-9]+' |
              grep -Eo '[0-9]+' |
              sort -u
          )" || true

          if [[ -z "$issue_numbers" ]]; then
            echo "종료할 연결 이슈가 없습니다."
            exit 0
          fi

          while IFS= read -r issue_number; do
            [[ -z "$issue_number" ]] && continue
            gh issue close "$issue_number" \
              --repo "$REPOSITORY" \
              --comment "PR #${PR_NUMBER} merge로 자동 종료"
          done <<< "$issue_numbers"
