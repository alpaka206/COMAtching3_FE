name: PR 규칙 확인

on:
  pull_request:
    types:
      - opened
      - edited
      - synchronize
      - reopened
    branches:
      - develop
      - main

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

permissions:
  contents: read
  pull-requests: read

jobs:
  policy:
    name: 대상 브랜치와 제목 확인
    runs-on: ubuntu-latest

    steps:
      - name: PR 규칙 검사
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BODY: ${{ github.event.pull_request.body }}
          BASE_REF: ${{ github.base_ref }}
          HEAD_REF: ${{ github.head_ref }}
          PR_FILES_URL: ${{ github.event.pull_request.url }}/files?per_page=100
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          python3 <<'PY'
          import os
          import re
          import sys

          title = os.environ["PR_TITLE"]
          body = os.environ["PR_BODY"]
          base_ref = os.environ["BASE_REF"]
          head_ref = os.environ["HEAD_REF"]

          title_pattern = re.compile(
              r"^(feat|fix|docs|style|refactor|test|chore|ci|perf|build|revert)"
              r"(\([a-zA-Z0-9._/-]+\))?: .+ "
              r"(구현|수정|개선|정리|삭제|추가|변경|대응|분리|연동|설정|보완|마이그레이션)$"
          )
          branch_pattern = re.compile(
              r"^(feat|fix|docs|style|refactor|test|chore|ci|perf|build|hotfix|release)/[a-z0-9._-]+$"
          )
          formal_pattern = re.compile(
              r"합니다|했습니다|됩니다|되었습니다|드립니다|부탁드립니다|바랍니다|주세요|주십시오|습니다|입니다|니다"
          )

          def fail(message: str) -> None:
              print(f"::error::{message}")
              sys.exit(1)

          if not re.search(r"[가-힣]", title):
              fail("PR 제목은 한국어 작성 필요")

          if formal_pattern.search(title):
              fail("PR 제목에 격식체 종결어 사용 금지")

          if not title_pattern.match(title):
              fail("PR 제목은 'feat: 매칭 결과 화면 구현' 또는 'fix: 로그인 오류 수정' 같은 형식 필요")

          if base_ref == "main":
              if head_ref != "develop":
                  fail("main 대상 PR은 develop 브랜치에서만 생성")
          elif base_ref == "develop":
              if not branch_pattern.match(head_ref):
                  fail("develop 대상 PR은 type/short-description 형식의 이슈 브랜치에서 생성")
          else:
              fail("PR 대상 브랜치는 develop 또는 main만 허용")

          if not body:
              fail("PR 본문 입력 필요")

          if not re.search(r"[가-힣]", body):
              fail("PR 본문은 한국어 작성 필요")

          if formal_pattern.search(body):
              fail("PR 본문에 격식체 종결어 사용 금지")

          for section in ("## 이슈", "## 변경 요약", "## 검증", "## BE 영향"):
              if section not in body:
                  fail(f"PR 본문 필수 섹션 누락: {section}")
          PY

          files_json="$(curl -fsSL \
            -H "Authorization: Bearer $GITHUB_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "$PR_FILES_URL")"

          if echo "$files_json" | jq -e '.[] | select(.filename == "package.json" or .filename == "package-lock.json") | (.patch // "") | test("\\+.*(firebase|@firebase/)"; "i")' >/dev/null; then
            echo "::error::Firebase 의존성 추가 금지"
            exit 1
          fi
