name: 기능 구현
description: 새 기능 또는 화면 구현
title: "feat: "
labels: ["feat"]
body:
  - type: markdown
    attributes:
      value: |
        제목 예시: `feat: 매칭 결과 화면 구현`
        브랜치 예시: `feat/matching-result`
  - type: textarea
    id: goal
    attributes:
      label: 목표
      description: 구현하려는 사용자 가치 또는 화면 흐름 정리
      placeholder: 매칭 결과를 사용자가 확인할 수 있는 화면 구현
    validations:
      required: true
  - type: textarea
    id: tasks
    attributes:
      label: 작업 목록
      description: 완료 기준이 보이는 단위로 작성
      placeholder: |
        - 결과 카드 UI 구현
        - 결과 조회 API 연동
        - 빈 상태/오류 상태 처리
    validations:
      required: true
  - type: textarea
    id: api
    attributes:
      label: BE 연동
      description: 필요한 API, 응답 형식, BE 확인 사항 정리
      placeholder: GET /api/matches/result 응답 형식 확인 필요
    validations:
      required: false
  - type: textarea
    id: verify
    attributes:
      label: 검증
      description: 수동 확인 또는 테스트 계획 작성
      placeholder: npm run build, 주요 화면 수동 확인
    validations:
      required: false
  - type: textarea
    id: security_quality
    attributes:
      label: 보안/품질 기준
      description: XSS, CSRF, 토큰, 성능, lazy loading, 이미지 최적화 고려 사항 정리
      placeholder: 입력값 렌더링 방식, 인증 필요 여부, 이미지/동적 로딩 계획 정리
    validations:
      required: false
