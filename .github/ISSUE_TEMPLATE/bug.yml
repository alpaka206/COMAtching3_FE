name: 버그 수정
description: 오류, 회귀, 예외 상황 수정
title: "fix: "
labels: ["fix"]
body:
  - type: markdown
    attributes:
      value: |
        제목 예시: `fix: 로그인 리다이렉트 오류 수정`
  - type: textarea
    id: problem
    attributes:
      label: 문제
      description: 발생한 문제와 영향을 받는 화면/흐름 정리
      placeholder: 로그인 성공 후 메인 화면으로 이동하지 않는 문제 수정
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: 재현 방법
      description: 재현 가능한 순서 작성
      placeholder: |
        1. 로그인 버튼 클릭
        2. 카카오 인증 완료
        3. 리다이렉트 실패 확인
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: 기대 결과
      placeholder: 로그인 성공 후 메인 화면 이동
    validations:
      required: true
  - type: textarea
    id: verify
    attributes:
      label: 검증
      placeholder: npm run build, 로그인 플로우 수동 확인
    validations:
      required: false
