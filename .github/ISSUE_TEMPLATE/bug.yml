name: 버그 수정
description: 오류, 회귀, 예외 상황 수정
title: "fix: "
labels: ["fix"]
body:
  - type: markdown
    attributes:
      value: |
        제목 예시: `fix: 로그인 리다이렉트 오류 수정`
        브랜치 예시: `fix/login-redirect`
  - type: textarea
    id: problem
    attributes:
      label: 문제
      description: 발생한 문제와 영향을 받는 화면/흐름 정리
      placeholder: 로그인 성공 후 메인 화면으로 이동하지 않는 문제 수정
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: 재현 방법
      description: 재현 가능한 순서 작성
      placeholder: |
        1. 로그인 버튼 클릭
        2. 카카오 인증 완료
        3. 리다이렉트 실패 확인
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: 기대 결과
      placeholder: 로그인 성공 후 메인 화면 이동
    validations:
      required: true
  - type: textarea
    id: verify
    attributes:
      label: 검증
      placeholder: npm run build, 로그인 플로우 수동 확인
    validations:
      required: false
  - type: textarea
    id: security_quality
    attributes:
      label: 보안/품질 영향
      description: XSS, CSRF, 토큰, 성능, lazy loading, 이미지 영향 정리
      placeholder: 영향 없음 또는 확인 필요 항목 정리
    validations:
      required: false
  - type: textarea
    id: api
    attributes:
      label: BE 영향
      description: API 계약 변경 또는 BE 확인 필요 여부 정리
      placeholder: API 요청/응답 변경 없음
    validations:
      required: false
