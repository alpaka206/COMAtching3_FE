name: 작업 정리
description: 설정, 문서, 리팩터링, CI 작업
title: "chore: "
labels: ["chore"]
body:
  - type: markdown
    attributes:
      value: |
        제목 예시: `chore: GitHub 협업 설정 정리`
        브랜치 예시: `chore/github-settings`
  - type: textarea
    id: scope
    attributes:
      label: 범위
      description: 작업 대상과 제외 대상을 함께 정리
      placeholder: GitHub 템플릿, 브랜치 규칙, 에이전트 규칙 정리
    validations:
      required: true
  - type: textarea
    id: tasks
    attributes:
      label: 작업 목록
      placeholder: |
        - PR 템플릿 추가
        - 이슈 템플릿 추가
        - 개발 규칙 문서 추가
    validations:
      required: true
  - type: textarea
    id: verify
    attributes:
      label: 검증
      placeholder: GitHub 템플릿 표시 확인, npm run build
    validations:
      required: false
  - type: dropdown
    id: category
    attributes:
      label: 작업 분류
      options:
        - 문서 정리
        - 설정 변경
        - CI 보완
        - 보안 점검
        - 성능 점검
        - 리팩터링
    validations:
      required: true
  - type: textarea
    id: risk
    attributes:
      label: 영향 범위
      description: 사용자 플로우, BE 계약, 배포 설정 영향 정리
      placeholder: 사용자 플로우 영향 없음, BE 계약 변경 없음
    validations:
      required: false
